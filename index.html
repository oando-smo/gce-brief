<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCE Daily Brief | Oando</title>
<style>
  html, body { margin: 0; height: 100%; background: #F4F5FA; overflow: hidden; }
  .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .frame.waiting { visibility: hidden; }
</style>
</head>
<body>
<iframe class="frame" id="f0" title="GCE Daily Brief" allowfullscreen></iframe>

<script>
  // GCE DAILY embed link: signs in automatically, hides filter pane and page tabs
  var REPORT_URL = "https://app.powerbi.com/reportEmbed?reportId=1bd1935b-c9f3-4100-9a75-04871ee05690&autoAuth=true&ctid=a3329a53-02fd-4abb-94cd-6d1b954419f6&filterPaneEnabled=false&navContentPaneEnabled=false";
  var EVERY_MINUTES = 20;

  var current = document.getElementById("f0");
  current.src = REPORT_URL;
  var lastLoad = Date.now();
  var busy = false;

  // Load a fresh copy behind the current one, then swap, so the screen never goes blank
  function reloadReport() {
    if (busy) return;
    busy = true;
    lastLoad = Date.now();
    var next = document.createElement("iframe");
    next.className = "frame waiting";
    next.title = "GCE Daily Brief";
    next.allowFullscreen = true;
    next.src = REPORT_URL + "&t=" + Date.now();
    next.onload = function () {
      setTimeout(function () {           // give the visuals time to render
        next.classList.remove("waiting");
        current.remove();
        current = next;
        busy = false;
      }, 15000);
    };
    document.body.appendChild(next);
  }

  // Each reload makes Power BI sign the viewer in again, so only reload when someone
  // can see the page; a background tab catches up as soon as it is shown again
  function due() { return Date.now() - lastLoad >= EVERY_MINUTES * 60 * 1000; }
  setInterval(function () { if (!document.hidden && due()) reloadReport(); }, 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && due()) reloadReport();
  });
</script>
</body>
</html>
